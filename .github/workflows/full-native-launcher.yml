name: Full native Bogo applications (reviewed branch dispatch)

# Compatibility entry point; the Bogo repository uses the reviewed feature branch
# as its default. No old repository or main branch is changed.
on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Publication is disabled in this branch verification workflow
        type: boolean
        default: false
        required: true
      app:
        description: Complete Bogo native app, or all fourteen
        type: choice
        options: [all, cad, design, vector, film, light, pdf, effect, ui, word, sound, deck, grid, launcher, photo]
        default: all
        required: false
      platform:
        description: Native platform, with matching full source
        type: choice
        options: [windows-x64, all, macos-arm64, source]
        default: windows-x64
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'qptywoei-sudo/bogo-native-apps'
    runs-on: ubuntu-24.04
    steps:
      - name: Keep branch builds separate from publication
        env:
          BOGO_PUBLISH_DRAFT: ${{ inputs.publish_draft }}
        run: test "$BOGO_PUBLISH_DRAFT" = false
  bogo:
    needs: validate
    uses: ./.github/workflows/bogo-native-apps.yml
    with:
      app: ${{ inputs.app || 'all' }}
      platform: ${{ inputs.platform || 'windows-x64' }}
