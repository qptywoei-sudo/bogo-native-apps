name: Full native KIO Word (manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to build
        type: choice
        options: [all, windows-x64, macos-arm64]
        default: all
        required: true
      publish_draft:
        description: Create a draft release after both native builds and full source packaging pass
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: full-native-word-${{ github.sha }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  native:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows-x64' && '["windows-x64"]' || inputs.platform == 'macos-arm64' && '["macos-arm64"]' || '["macos-arm64","windows-x64"]') }}
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || 'windows-2022' }}
    env:
      KIO_PYTHON: ${{ matrix.platform == 'windows-x64' && 'python' || 'python3' }}
      KIO_TARGET: ${{ matrix.platform == 'windows-x64' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify orchestrator guards
        run: $KIO_PYTHON -m unittest discover -s tests -v
      - name: Install the locked Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target "$KIO_TARGET"
      - name: Fetch exact sources, fonts and apply the locked full-app patch
        run: $KIO_PYTHON scripts/kio_native.py prepare --app word
      - name: Build the complete native app and CLI, test original core, check DOCX and PDF
        run: $KIO_PYTHON scripts/kio_native.py build --app word --platform ${{ matrix.platform }}
      - name: Package the full native application and license texts
        run: $KIO_PYTHON scripts/kio_native.py package --app word --platform ${{ matrix.platform }}
      - name: Verify exact release allowlist and SHA-256
        run: $KIO_PYTHON scripts/kio_native.py verify --directory dist/word-${{ matrix.platform }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: word-${{ matrix.platform }}
          path: dist/word-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  full-source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/kio_native.py prepare --app word
      - name: Bundle full patched workspace, fixed fonts, locked dependencies and build scripts
        run: python3 scripts/kio_native.py source --app word
      - run: python3 scripts/kio_native.py verify --directory dist/word-source
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: word-source
          path: dist/word-source/
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft && inputs.platform == 'all' && github.ref == 'refs/heads/main'
    needs: [native, full-source]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: word-*
          path: publish-inputs
          merge-multiple: false
      - name: Verify all three exact manifests, then create a draft in this repository
        run: python3 scripts/kio_native.py publish-draft --app word --directory publish-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIO_PUBLISH_DRAFT: 'true'
