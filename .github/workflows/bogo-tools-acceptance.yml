name: Bogo Tools frozen release acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed workflow commit SHA (40 lowercase hex characters)
        required: true
        type: string

permissions: {}

concurrency:
  group: bogo-tools-4.6.23-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'qptywoei-sudo/bogo-native-apps'
    # GitHub draft visibility requires push capability. This fresh job executes
    # only audited GETs and no program; its token never enters a GUI job.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            python: python
          - runner: macos-15-intel
            platform: macos
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BOGO_ACCEPTANCE_PHASE: fetch
    steps:
      - name: Check reviewed workflow revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ${{ matrix.python }} -c 'import os,re; expected=os.environ["EXPECTED_SHA"]; assert re.fullmatch("[0-9a-f]{40}",expected) and expected==os.environ["GITHUB_SHA"], "Reviewed workflow SHA mismatch"'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test evidence and isolation guards without launching programs
        shell: bash
        run: ${{ matrix.python }} -m unittest discover -s tests -p test_tools_ci_acceptance.py -v
      - name: GET and verify frozen draft assets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ matrix.python }} scripts/tools-ci-acceptance.py fetch --platform '${{ matrix.platform }}' --root "$RUNNER_TEMP/bogo-tools-acceptance"
      - name: Transfer only frozen inputs and public fetch receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bogo-tools-4.6.23-${{ matrix.platform }}-frozen-inputs
          path: |
            ${{ runner.temp }}/bogo-tools-acceptance/assets/
            ${{ runner.temp }}/bogo-tools-acceptance/receipt.json
            ${{ runner.temp }}/bogo-tools-acceptance/output/fetch-proof.json
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
      - name: Upload bounded public fetch diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bogo-tools-4.6.23-${{ matrix.platform }}-fetch-diagnostics
          path: ${{ runner.temp }}/bogo-tools-acceptance/output/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14

  accept:
    needs: fetch
    if: github.event_name == 'workflow_dispatch' && github.repository == 'qptywoei-sudo/bogo-native-apps'
    # A different fresh VM with read-only repository access executes the apps.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            python: python
          - runner: macos-15-intel
            platform: macos
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BOGO_ACCEPTANCE_PHASE: gui
    steps:
      - name: Check reviewed workflow revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ${{ matrix.python }} -c 'import os,re; expected=os.environ["EXPECTED_SHA"]; assert re.fullmatch("[0-9a-f]{40}",expected) and expected==os.environ["GITHUB_SHA"], "Reviewed workflow SHA mismatch"'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Receive same-workflow fixed input artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bogo-tools-4.6.23-${{ matrix.platform }}-frozen-inputs
          path: ${{ runner.temp }}/bogo-tools-acceptance/
      - name: Recheck all frozen hashes then accept normal app and signed upgrade
        shell: bash
        run: |
          ${{ matrix.python }} scripts/tools-ci-acceptance.py accept --platform '${{ matrix.platform }}' --root "$RUNNER_TEMP/bogo-tools-acceptance"
      - name: Upload explicit public GUI evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bogo-tools-4.6.23-${{ matrix.platform }}-actual-acceptance
          path: ${{ runner.temp }}/bogo-tools-acceptance/output/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
