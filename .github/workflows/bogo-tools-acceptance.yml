name: Bogo Tools frozen release acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed workflow commit SHA (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bogo-tools-4.6.23-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'qptywoei-sudo/bogo-native-apps'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            python: python
          - runner: macos-15-intel
            platform: macos
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check reviewed workflow revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ${{ matrix.python }} -c 'import os,re; expected=os.environ["EXPECTED_SHA"]; assert re.fullmatch("[0-9a-f]{40}",expected) and expected==os.environ["GITHUB_SHA"], "Reviewed workflow SHA mismatch"'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test evidence and isolation guards
        shell: bash
        run: ${{ matrix.python }} -m unittest discover -s tests -p test_tools_ci_acceptance.py -v
      - name: Download and verify frozen draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ matrix.python }} scripts/tools-ci-acceptance.py fetch --platform '${{ matrix.platform }}' --root "$RUNNER_TEMP/bogo-tools-acceptance"
      - name: Accept exact normal app, signed upgrade and own-window evidence
        shell: bash
        run: |
          ${{ matrix.python }} scripts/tools-ci-acceptance.py accept --platform '${{ matrix.platform }}' --root "$RUNNER_TEMP/bogo-tools-acceptance"
      - name: Upload explicit public evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bogo-tools-4.6.23-${{ matrix.platform }}-actual-acceptance
          path: ${{ runner.temp }}/bogo-tools-acceptance/output/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
