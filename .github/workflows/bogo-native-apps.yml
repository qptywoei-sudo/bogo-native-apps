name: Bogo native applications (manual verification)

on:
  workflow_call:
    inputs:
      app:
        type: string
        default: all
        required: false
      platform:
        type: string
        default: all
        required: false
  workflow_dispatch:
    inputs:
      app:
        description: Verified full native application
        type: choice
        options: [all, cad, design, vector, film, light, pdf, effect, ui, word, sound, deck, grid, launcher, photo]
        default: all
        required: true
      platform:
        description: Native operating systems to build, with matching full source
        type: choice
        options: [all, windows-x64, macos-arm64, source]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: bogo-native-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Verify public source and select exact Bogo native targets
    if: github.repository == 'qptywoei-sudo/bogo-native-apps'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      source: ${{ steps.matrix.outputs.source }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - id: matrix
        env:
          BOGO_APP: ${{ inputs.app }}
          BOGO_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          result = subprocess.check_output(['python3','scripts/bogo_native.py','matrix','--app',os.environ['BOGO_APP']], text=True).strip()
          rows = json.loads(result)['include']
          platform = os.environ['BOGO_PLATFORM']
          assert platform in ('all', 'windows-x64', 'macos-arm64', 'source'), 'Invalid Bogo native platform'
          if platform not in ('all', 'source'):
              rows = [row for row in rows if row['platform'] == platform]
          assert rows, 'Bogo native matrix must not be empty'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('value=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
              out.write('source=' + json.dumps({'app':list(dict.fromkeys(row['app'] for row in rows))}) + '\n')
          PY
  native:
    name: ${{ matrix.app }} on ${{ matrix.platform }} with installer acceptance
    if: inputs.platform != 'source'
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify owner-derived icons and all source overlay identities on the target OS
        run: ${{ matrix.python }} -m unittest discover -s tests -p test_bogo_native.py -v
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target ${{ matrix.target }}
      - if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed' }
      - run: ${{ matrix.python }} scripts/bogo_native.py prepare --app ${{ matrix.app }}
      - run: ${{ matrix.python }} scripts/bogo_native.py build --app ${{ matrix.app }} --platform ${{ matrix.platform }}
      - run: ${{ matrix.python }} scripts/bogo_native.py package --app ${{ matrix.app }} --platform ${{ matrix.platform }}
      - run: ${{ matrix.python }} scripts/bogo_native.py verify --app ${{ matrix.app }} --platform ${{ matrix.platform }} --directory dist/${{ matrix.app }}-${{ matrix.platform }}
      - if: matrix.platform == 'windows-x64'
        name: Install, upgrade, inspect PE icons and launch installed and portable apps
        env:
          BOGO_QA_OUTPUT: ${{ runner.temp }}/bogo-windows-smoke-${{ matrix.app }}
        run: ${{ matrix.python }} scripts/smoke_bogo_windows.py --app ${{ matrix.app }} --directory dist/${{ matrix.app }}-${{ matrix.platform }} --output "$BOGO_QA_OUTPUT" --allow-ephemeral-install
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: bogo-${{ matrix.app }}-${{ matrix.platform }}
          path: |
            dist/${{ matrix.app }}-${{ matrix.platform }}/
            ${{ runner.temp }}/bogo-windows-smoke-${{ matrix.app }}/
          if-no-files-found: error
          retention-days: 14
  source:
    name: Complete corresponding source for ${{ matrix.app }}
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.source) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 scripts/bogo_native.py prepare --app ${{ matrix.app }}
      - run: python3 scripts/bogo_native.py source --app ${{ matrix.app }}
      - run: python3 scripts/bogo_native.py verify --app ${{ matrix.app }} --platform source --directory dist/${{ matrix.app }}-source
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bogo-${{ matrix.app }}-source
          path: dist/${{ matrix.app }}-source/
          if-no-files-found: error
          retention-days: 14
